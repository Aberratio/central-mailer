name: Deploy API

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Where should the API be deployed?"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      migration_mode:
        description: "How should database migrations be handled?"
        required: true
        default: run
        type: choice
        options:
          - run
          - adopt-existing
          - baseline
          - dry-run
          - skip
      confirm_production:
        description: "Type DEPLOY_PRODUCTION to confirm production deploy."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: api-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'staging' }}
  cancel-in-progress: false

env:
  TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'staging' }}
  MIGRATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_mode || 'run' }}
  CONFIRM_PRODUCTION: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_production || '' }}

jobs:
  deploy:
    name: Deploy API ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@27853eb8b46dc01c33bf9fef67d98df2683c3be2 # 2.34.0
        with:
          php-version: "8.2"
          extensions: fileinfo, json, mbstring, pdo_mysql, zlib
          tools: composer:v2

      - name: Build API artifact
        run: |
          set -Eeuo pipefail
          composer validate --no-check-publish
          composer install --prefer-dist --no-interaction
          composer audit --locked
          find bin public src scripts -name '*.php' -print0 | xargs -0 -n1 php -l
          php scripts/run-tests.php
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          mkdir -p artifact
          rsync -a ./ artifact/api/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='artifact' \
            --exclude='.phpunit.cache' \
            --exclude='storage/logs/*' \
            --exclude='storage/attachments/*' \
            --exclude='serv.zip' \
            --exclude='server.zip'
          cd artifact/api
          zip -r ../api.zip .

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_PORT" ] || [ -z "$SSH_PRIVATE_KEY" ] || [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "SSH_HOST, SSH_PORT, SSH_PRIVATE_KEY and SSH_KNOWN_HOSTS are required."
            exit 30
          fi

          case "$SSH_HOST" in
            http://*|https://*|*/*)
              echo "SSH_HOST must be a hostname only, for example h29.seohost.pl."
              exit 31
              ;;
          esac

          case "$SSH_PORT" in
            ''|*[!0-9]*)
              echo "SSH_PORT must be a number."
              exit 32
              ;;
          esac

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "SSH_KNOWN_HOSTS is empty."
            exit 34
          fi

      - name: Upload and deploy API
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          BACKEND_REMOTE_DIR: ${{ secrets.BACKEND_REMOTE_DIR }}
          BACKEND_ALLOWED_ROOT: ${{ secrets.BACKEND_ALLOWED_ROOT }}
          BACKEND_BACKUP_DIR: ${{ secrets.BACKEND_BACKUP_DIR }}
          API_URL: ${{ secrets.API_URL }}
        run: |
          set -Eeuo pipefail
          if [ "$TARGET_ENV" = "production" ] && [ "$CONFIRM_PRODUCTION" != "DEPLOY_PRODUCTION" ]; then
            echo "Production deploy requires confirm_production=DEPLOY_PRODUCTION."
            exit 50
          fi
          if [ "$TARGET_ENV" = "production" ] && [ "$MIGRATION_MODE" = "skip" ]; then
            echo "Production deploy cannot skip migrations."
            exit 52
          fi
          if [ -z "$SSH_USER" ] || [ -z "$BACKEND_REMOTE_DIR" ] || [ -z "$BACKEND_ALLOWED_ROOT" ] || [ -z "$BACKEND_BACKUP_DIR" ] || [ -z "$API_URL" ]; then
            echo "SSH_USER, BACKEND_REMOTE_DIR, BACKEND_ALLOWED_ROOT, BACKEND_BACKUP_DIR and API_URL are required."
            exit 51
          fi

          DEPLOY_ID="${TARGET_ENV}-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          REMOTE_ZIP="$BACKEND_REMOTE_DIR/.deploy/api-${DEPLOY_ID}.zip"
          printf -v REMOTE_ENV 'BACKEND_REMOTE_DIR=%q BACKEND_ALLOWED_ROOT=%q BACKEND_BACKUP_DIR=%q REMOTE_ZIP=%q TARGET_ENV=%q MIGRATION_MODE=%q DEPLOY_ID=%q API_URL=%q' "$BACKEND_REMOTE_DIR" "$BACKEND_ALLOWED_ROOT" "$BACKEND_BACKUP_DIR" "$REMOTE_ZIP" "$TARGET_ENV" "$MIGRATION_MODE" "$DEPLOY_ID" "$API_URL"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$REMOTE_ENV bash -s" <<'REMOTE'
          set -Eeuo pipefail

          if [ -z "$BACKEND_REMOTE_DIR" ]; then
            echo "BACKEND_REMOTE_DIR is required."
            exit 10
          fi

          if [ -z "$BACKEND_ALLOWED_ROOT" ]; then
            echo "BACKEND_ALLOWED_ROOT is required."
            exit 11
          fi

          case "$BACKEND_ALLOWED_ROOT" in
            /*) ;;
            *)
              echo "BACKEND_ALLOWED_ROOT must be an absolute path."
              exit 27
              ;;
          esac

          if [ -z "$BACKEND_BACKUP_DIR" ]; then
            echo "BACKEND_BACKUP_DIR is required."
            exit 12
          fi

          if [ "$BACKEND_REMOTE_DIR" = "/" ] || [ "$BACKEND_REMOTE_DIR" = "." ] || [ "$BACKEND_REMOTE_DIR" = "$HOME" ] || [ "$BACKEND_REMOTE_DIR" = "~" ]; then
            echo "BACKEND_REMOTE_DIR points to an unsafe location: $BACKEND_REMOTE_DIR"
            exit 13
          fi

          case "$BACKEND_REMOTE_DIR" in
            *..*)
              echo "BACKEND_REMOTE_DIR cannot contain '..'."
              exit 14
              ;;
          esac

          case "$BACKEND_BACKUP_DIR" in
            /*) ;;
            *)
              echo "BACKEND_BACKUP_DIR must be an absolute path."
              exit 15
              ;;
          esac

          command -v realpath >/dev/null
          command -v gzip >/dev/null
          command -v php >/dev/null
          command -v rsync >/dev/null
          command -v unzip >/dev/null
          command -v curl >/dev/null
          command -v openssl >/dev/null
          command -v mv >/dev/null

          BACKEND_REMOTE_DIR_REAL="$(realpath -e "$BACKEND_REMOTE_DIR")"
          BACKEND_ALLOWED_ROOT_REAL="$(realpath -e "$BACKEND_ALLOWED_ROOT")"

          case "$BACKEND_REMOTE_DIR_REAL" in
            /|.|"$HOME")
              echo "BACKEND_REMOTE_DIR points to an unsafe location: $BACKEND_REMOTE_DIR_REAL"
              exit 16
              ;;
          esac

          case "$BACKEND_REMOTE_DIR_REAL/" in
            "$BACKEND_ALLOWED_ROOT_REAL"/*|"$BACKEND_ALLOWED_ROOT_REAL/") ;;
            *)
              echo "BACKEND_REMOTE_DIR is outside BACKEND_ALLOWED_ROOT."
              echo "BACKEND_REMOTE_DIR_REAL=$BACKEND_REMOTE_DIR_REAL"
              echo "BACKEND_ALLOWED_ROOT_REAL=$BACKEND_ALLOWED_ROOT_REAL"
              exit 17
              ;;
          esac

          if [ ! -f "$BACKEND_REMOTE_DIR_REAL/.central-mailer-api-root" ]; then
            echo "Missing deploy marker: $BACKEND_REMOTE_DIR_REAL/.central-mailer-api-root"
            exit 18
          fi

          if [ ! -f "$BACKEND_REMOTE_DIR_REAL/.env" ]; then
            echo "Missing backend env file: $BACKEND_REMOTE_DIR_REAL/.env"
            exit 19
          fi

          mkdir -p "$BACKEND_REMOTE_DIR_REAL/.deploy" "$BACKEND_BACKUP_DIR"
          chmod 700 "$BACKEND_BACKUP_DIR"
          BACKEND_BACKUP_DIR_REAL="$(cd "$BACKEND_BACKUP_DIR" && pwd -P)"

          case "$BACKEND_BACKUP_DIR_REAL/" in
            "$BACKEND_REMOTE_DIR_REAL"/*|"$BACKEND_REMOTE_DIR_REAL/")
              echo "BACKEND_BACKUP_DIR must be outside BACKEND_REMOTE_DIR."
              echo "BACKEND_BACKUP_DIR_REAL=$BACKEND_BACKUP_DIR_REAL"
              echo "BACKEND_REMOTE_DIR_REAL=$BACKEND_REMOTE_DIR_REAL"
              exit 24
              ;;
          esac
          REMOTE

          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" artifact/api.zip "$SSH_USER@$SSH_HOST:$REMOTE_ZIP"

          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "$REMOTE_ENV bash -s" <<'REMOTE'
          set -Eeuo pipefail
          umask 077

          BACKEND_REMOTE_DIR_REAL="$(realpath -e "$BACKEND_REMOTE_DIR")"
          BACKEND_ALLOWED_ROOT_REAL="$(realpath -e "$BACKEND_ALLOWED_ROOT")"
          BACKEND_BACKUP_DIR_REAL="$(cd "$BACKEND_BACKUP_DIR" && pwd -P)"
          ENV_FILE="$BACKEND_REMOTE_DIR_REAL/.env"
          REMOTE_ZIP="$BACKEND_REMOTE_DIR_REAL/.deploy/api-${DEPLOY_ID}.zip"

          case "$BACKEND_REMOTE_DIR_REAL/" in
            "$BACKEND_ALLOWED_ROOT_REAL"/*|"$BACKEND_ALLOWED_ROOT_REAL/") ;;
            *)
              echo "BACKEND_REMOTE_DIR is outside BACKEND_ALLOWED_ROOT."
              echo "BACKEND_REMOTE_DIR_REAL=$BACKEND_REMOTE_DIR_REAL"
              echo "BACKEND_ALLOWED_ROOT_REAL=$BACKEND_ALLOWED_ROOT_REAL"
              exit 17
              ;;
          esac

          case "$BACKEND_BACKUP_DIR_REAL/" in
            "$BACKEND_REMOTE_DIR_REAL"/*|"$BACKEND_REMOTE_DIR_REAL/")
              echo "BACKEND_BACKUP_DIR must be outside BACKEND_REMOTE_DIR."
              exit 24
              ;;
          esac

          get_env() {
            local key="$1"
            local line
            line="$(grep -E "^${key}=" "$ENV_FILE" | tail -n 1 || true)"
            line="${line#*=}"
            line="${line%\"}"
            line="${line#\"}"
            line="${line%\'}"
            line="${line#\'}"
            printf '%s' "$line"
          }

          check_health() {
            local url="${API_URL%/}/health"
            local attempts="${1:-12}"
            local delay_seconds="${2:-5}"
            local attempt

            attempt=1
            while [ "$attempt" -le "$attempts" ]; do
              if curl --fail --show-error --silent --location --connect-timeout 5 --max-time 15 "$url"; then
                printf '\nHealth check passed on attempt %s/%s.\n' "$attempt" "$attempts"
                return 0
              fi

              if [ "$attempt" -lt "$attempts" ]; then
                printf 'Health check failed on attempt %s/%s; retrying in %ss.\n' "$attempt" "$attempts" "$delay_seconds" >&2
                sleep "$delay_seconds"
              fi

              attempt=$((attempt + 1))
            done

            printf 'Health check failed after %s attempts.\n' "$attempts" >&2
            return 1
          }

          DB_HOST="$(get_env DB_HOST)"
          DB_PORT="$(get_env DB_PORT)"
          DB_DATABASE="$(get_env DB_DATABASE)"
          DB_USERNAME="$(get_env DB_USERNAME)"
          DB_PASSWORD="$(get_env DB_PASSWORD)"
          APP_ENV="$(get_env APP_ENV)"
          LOG_DIR="$(get_env LOG_DIR)"
          CONFIGURED_DATABASE_DUMP_BIN="$(get_env DATABASE_DUMP_BIN)"
          BACKUP_RETENTION_DAYS="$(get_env BACKUP_RETENTION_DAYS)"
          BACKUP_ENCRYPTION_KEY="$(get_env BACKUP_ENCRYPTION_KEY)"

          MYSQLDUMP_BIN="$(command -v mysqldump || true)"
          DATABASE_DUMP_BIN="$CONFIGURED_DATABASE_DUMP_BIN"
          if [ -n "$DATABASE_DUMP_BIN" ] && [ ! -x "$DATABASE_DUMP_BIN" ]; then
            echo "Configured DATABASE_DUMP_BIN is not executable: $DATABASE_DUMP_BIN"
            exit 33
          fi
          if [ -z "$DATABASE_DUMP_BIN" ]; then
            DATABASE_DUMP_BIN="$(command -v mariadb-dump || true)"
          fi
          if [ -z "$DATABASE_DUMP_BIN" ] && [ -n "$MYSQLDUMP_BIN" ] && [ -x "$(dirname "$MYSQLDUMP_BIN")/mariadb-dump" ]; then
            DATABASE_DUMP_BIN="$(dirname "$MYSQLDUMP_BIN")/mariadb-dump"
          fi
          if [ -z "$DATABASE_DUMP_BIN" ]; then
            for candidate in /usr/local/mariadb-*/bin/mariadb-dump; do
              if [ -x "$candidate" ]; then
                DATABASE_DUMP_BIN="$candidate"
                break
              fi
            done
          fi
          if [ -z "$DATABASE_DUMP_BIN" ]; then
            DATABASE_DUMP_BIN="$MYSQLDUMP_BIN"
          fi
          if [ -z "$DATABASE_DUMP_BIN" ]; then
            echo "Neither mariadb-dump nor mysqldump is available."
            exit 33
          fi

          if [ -z "$BACKUP_RETENTION_DAYS" ]; then
            BACKUP_RETENTION_DAYS=30
          fi
          if [ -z "$LOG_DIR" ]; then
            LOG_DIR="$BACKEND_REMOTE_DIR_REAL/storage/logs"
          fi
          case "$LOG_DIR" in
            /*) ;;
            *)
              echo "LOG_DIR must be an absolute path when set."
              exit 36
              ;;
          esac

          mkdir -p "$LOG_DIR"
          chmod 700 "$LOG_DIR"
          LOG_DIR_REAL="$(cd "$LOG_DIR" && pwd -P)"
          case "$LOG_DIR_REAL/" in
            "$BACKEND_REMOTE_DIR_REAL/public/"*|"$BACKEND_REMOTE_DIR_REAL/public_html/"*)
              echo "LOG_DIR must be outside public web directories."
              exit 35
              ;;
          esac
          LOG_TEST_FILE="$LOG_DIR_REAL/.deploy-write-test"
          printf '%s\n' "$DEPLOY_ID" > "$LOG_TEST_FILE"
          chmod 600 "$LOG_TEST_FILE"
          rm -f "$LOG_TEST_FILE"

          if [ "$TARGET_ENV" != "$APP_ENV" ]; then
            echo "TARGET_ENV=$TARGET_ENV but APP_ENV=$APP_ENV in $ENV_FILE"
            exit 25
          fi

          if [ -z "$DB_HOST" ] || [ -z "$DB_PORT" ] || [ -z "$DB_DATABASE" ] || [ -z "$DB_USERNAME" ]; then
            echo "Database settings are incomplete in $ENV_FILE"
            exit 20
          fi

          if [ "$TARGET_ENV" = "production" ] && [ -z "$DB_PASSWORD" ]; then
            echo "DB_PASSWORD is empty; refusing production deploy."
            exit 26
          fi
          if [ ${#BACKUP_ENCRYPTION_KEY} -lt 32 ]; then
            echo "BACKUP_ENCRYPTION_KEY must contain at least 32 characters."
            exit 39
          fi

          case "$BACKUP_RETENTION_DAYS" in
            ''|*[!0-9]*)
              echo "BACKUP_RETENTION_DAYS must be a positive integer."
              exit 38
              ;;
          esac

          MYSQL_CNF="$(mktemp)"
          trap 'rm -f "$MYSQL_CNF"' EXIT
          chmod 600 "$MYSQL_CNF"
          cat > "$MYSQL_CNF" <<MYSQLCNF
          [client]
          host=$DB_HOST
          port=$DB_PORT
          user=$DB_USERNAME
          password=$DB_PASSWORD
          default-character-set=utf8mb4
          MYSQLCNF

          export BACKUP_ENCRYPTION_KEY
          BACKUP_FILE="$BACKEND_BACKUP_DIR_REAL/predeploy-$TARGET_ENV-$(date +%Y%m%d-%H%M%S).sql.gz.enc"
          "$DATABASE_DUMP_BIN" --defaults-extra-file="$MYSQL_CNF" --single-transaction --routines --triggers "$DB_DATABASE" \
            | gzip -c \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:BACKUP_ENCRYPTION_KEY \
            > "$BACKUP_FILE"
          chmod 600 "$BACKUP_FILE"
          echo "Encrypted database backup created: $BACKUP_FILE"

          if ! openssl enc -d -aes-256-cbc -pbkdf2 -pass env:BACKUP_ENCRYPTION_KEY -in "$BACKUP_FILE" | gzip -t; then
            echo "Database backup is invalid: $BACKUP_FILE"
            exit 21
          fi

          find "$BACKEND_BACKUP_DIR_REAL" -maxdepth 1 -type f -name 'predeploy-*.sql.gz.enc' -mtime "+$BACKUP_RETENTION_DAYS" -delete

          if [ "$MIGRATION_MODE" = "dry-run" ] || [ "$MIGRATION_MODE" = "baseline" ]; then
            CHECK_DIR="$(mktemp -d "$BACKEND_REMOTE_DIR_REAL/.deploy/check-${DEPLOY_ID}.XXXXXX")"
            cleanup_check_dir() {
              case "$CHECK_DIR" in
                "$BACKEND_REMOTE_DIR_REAL/.deploy/check-"*) rm -rf -- "$CHECK_DIR" ;;
                *) echo "Refusing to remove unsafe CHECK_DIR: $CHECK_DIR" ;;
              esac
            }
            trap 'rm -f "$MYSQL_CNF"; cleanup_check_dir' EXIT

            unzip -o -q "$REMOTE_ZIP" -d "$CHECK_DIR"
            cp "$ENV_FILE" "$CHECK_DIR/.env"
            php "$CHECK_DIR/scripts/validate-config.php"

            if [ "$MIGRATION_MODE" = "dry-run" ]; then
              php "$CHECK_DIR/scripts/run-migrations.php" --dry-run
              echo "Migration dry-run finished. API files were not changed."
            else
              php "$CHECK_DIR/scripts/run-migrations.php" --baseline
              echo "Migration baseline finished. API files were not changed."
            fi

            rm -f "$REMOTE_ZIP"
            exit 0
          fi

          RELEASES_DIR="$BACKEND_REMOTE_DIR_REAL/releases"
          RELEASE_DIR="$RELEASES_DIR/$DEPLOY_ID"
          mkdir -p "$RELEASES_DIR" "$BACKEND_REMOTE_DIR_REAL/storage/logs" "$BACKEND_REMOTE_DIR_REAL/storage/attachments" "$BACKEND_REMOTE_DIR_REAL/.well-known"
          unzip -o -q "$REMOTE_ZIP" -d "$RELEASE_DIR"
          rm -f "$REMOTE_ZIP"
          cp "$ENV_FILE" "$RELEASE_DIR/.env"
          chmod 600 "$RELEASE_DIR/.env"
          rm -rf -- "$RELEASE_DIR/storage/logs" "$RELEASE_DIR/storage/attachments"
          ln -s "$BACKEND_REMOTE_DIR_REAL/storage/logs" "$RELEASE_DIR/storage/logs"
          ln -s "$BACKEND_REMOTE_DIR_REAL/storage/attachments" "$RELEASE_DIR/storage/attachments"
          rm -rf -- "$RELEASE_DIR/public/.well-known"
          ln -s "$BACKEND_REMOTE_DIR_REAL/.well-known" "$RELEASE_DIR/public/.well-known"

          PUBLIC_DIR="$RELEASE_DIR/public"
          PUBLIC_HTML="$BACKEND_REMOTE_DIR_REAL/public_html"
          PUBLICATION_MODE="symlink"
          PUBLIC_HTML_BACKUP=""

          if [ ! -f "$PUBLIC_DIR/index.php" ] || [ ! -f "$PUBLIC_DIR/.htaccess" ]; then
            echo "Missing API public entrypoint files in $PUBLIC_DIR"
            exit 28
          fi

          if [ -e "$PUBLIC_HTML" ] && [ ! -L "$PUBLIC_HTML" ]; then
            if [ ! -d "$PUBLIC_HTML" ]; then
              echo "public_html exists but is neither a directory nor a symlink: $PUBLIC_HTML"
              exit 29
            fi
            PUBLICATION_MODE="directory"
          fi

          php "$RELEASE_DIR/scripts/validate-config.php"

          case "$MIGRATION_MODE" in
            run)
              php "$RELEASE_DIR/scripts/run-migrations.php"
              ;;
            adopt-existing)
              php "$RELEASE_DIR/scripts/run-migrations.php" --adopt-existing
              ;;
            skip)
              echo "Migrations skipped by workflow input."
              ;;
            baseline)
              echo "Baseline mode should have exited before deployment."
              exit 22
              ;;
            *)
              echo "Unsupported MIGRATION_MODE: $MIGRATION_MODE"
              exit 23
              ;;
          esac

          if [ "$PUBLICATION_MODE" = "directory" ]; then
            PUBLIC_HTML_BACKUP="$BACKEND_REMOTE_DIR_REAL/.deploy/public_html-backup-$DEPLOY_ID"
            if [ -e "$PUBLIC_HTML_BACKUP" ]; then
              echo "public_html backup target already exists: $PUBLIC_HTML_BACKUP"
              exit 29
            fi
            mkdir -p "$PUBLIC_HTML_BACKUP"
            rsync -a --exclude='.well-known/' "$PUBLIC_HTML/" "$PUBLIC_HTML_BACKUP/"
            rsync -a --delete --exclude='.well-known/' "$RELEASE_DIR/public/" "$PUBLIC_HTML/"
            echo "Published release into existing public_html directory."
          fi

          PREVIOUS_RELEASE="$(readlink "$BACKEND_REMOTE_DIR_REAL/current" || true)"
          ln -s "$RELEASE_DIR" "$BACKEND_REMOTE_DIR_REAL/.deploy/current-$DEPLOY_ID"
          mv -Tf "$BACKEND_REMOTE_DIR_REAL/.deploy/current-$DEPLOY_ID" "$BACKEND_REMOTE_DIR_REAL/current"
          if [ "$PUBLICATION_MODE" = "symlink" ]; then
            ln -s "$RELEASE_DIR/public" "$BACKEND_REMOTE_DIR_REAL/.deploy/public-$DEPLOY_ID"
            mv -Tf "$BACKEND_REMOTE_DIR_REAL/.deploy/public-$DEPLOY_ID" "$PUBLIC_HTML"
          fi

          if ! check_health 12 5; then
            if [ -n "$PREVIOUS_RELEASE" ] && [ -d "$PREVIOUS_RELEASE" ]; then
              ln -s "$PREVIOUS_RELEASE" "$BACKEND_REMOTE_DIR_REAL/.deploy/rollback-current-$DEPLOY_ID"
              mv -Tf "$BACKEND_REMOTE_DIR_REAL/.deploy/rollback-current-$DEPLOY_ID" "$BACKEND_REMOTE_DIR_REAL/current"
            else
              rm -f -- "$BACKEND_REMOTE_DIR_REAL/current"
            fi
            if [ "$PUBLICATION_MODE" = "directory" ] && [ -d "$PUBLIC_HTML_BACKUP" ]; then
              rsync -a --delete --exclude='.well-known/' "$PUBLIC_HTML_BACKUP/" "$PUBLIC_HTML/"
            elif [ -n "$PREVIOUS_RELEASE" ] && [ -d "$PREVIOUS_RELEASE" ]; then
              ln -s "$PREVIOUS_RELEASE/public" "$BACKEND_REMOTE_DIR_REAL/.deploy/rollback-public-$DEPLOY_ID"
              mv -Tf "$BACKEND_REMOTE_DIR_REAL/.deploy/rollback-public-$DEPLOY_ID" "$PUBLIC_HTML"
            else
              rm -f -- "$PUBLIC_HTML"
            fi
            echo "Health check failed; application publication was rolled back."
            exit 39
          fi

          if [ -n "$PUBLIC_HTML_BACKUP" ] && [ -d "$PUBLIC_HTML_BACKUP" ]; then
            rm -rf -- "$PUBLIC_HTML_BACKUP"
          fi
          find "$RELEASES_DIR" -mindepth 1 -maxdepth 1 -type d ! -path "$RELEASE_DIR" -mtime +14 -exec rm -rf -- {} +
          echo "Activated API release $RELEASE_DIR"
          REMOTE

      - name: Health check
        if: env.MIGRATION_MODE == 'run' || env.MIGRATION_MODE == 'skip'
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          set -Eeuo pipefail
          if [ -z "$API_URL" ]; then
            echo "API_URL is required."
            exit 40
          fi
          health_url="${API_URL%/}/health"
          attempt=1
          while [ "$attempt" -le 12 ]; do
            if curl --fail --show-error --silent --location --connect-timeout 5 --max-time 15 "$health_url"; then
              printf '\nHealth check passed on attempt %s/12.\n' "$attempt"
              exit 0
            fi

            if [ "$attempt" -lt 12 ]; then
              echo "Health check failed on attempt $attempt/12; retrying in 5s." >&2
              sleep 5
            fi

            attempt=$((attempt + 1))
          done

          echo "Health check failed after 12 attempts." >&2
          exit 40
